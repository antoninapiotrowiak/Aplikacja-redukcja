<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posiłki - Aplikacja Fitness 🍽️</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --accent: #2ecc71;
            --border: #e1e8ed;
        }

        body.dark-mode {
            --primary: #5c9ded;
            --primary-light: #1e293b;
            --text: #f1f5f9;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #34d399;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 6px 8px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            box-sizing: border-box;
        }

        button.btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- PASEK UŻYTKOWNIKA -->
    <div class="user-bar">
        <div style="font-weight: 700; font-size: 0.85rem;">🍽️ Rejestr Posiłków</div>
        <button onclick="toggleDarkMode()" style="background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Przełącz motyw">🌙</button>
    </div>

    <!-- NAWIGACJA -->
    <nav class="top-nav">
        <a href="index.html" class="nav-link">🏠 Główna</a>
        <a href="posilki.html" class="nav-link active">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link">⏱️ Trening</a>
        <a href="statystyki.html" class="nav-link">📊 Staty</a>
        <a href="przepisy.html" class="nav-link">🥗 Przepisy</a>
    </nav>

    <!-- SEKCJ POSIŁKÓW -->
    <div class="card">
        <h2>Dodaj Posiłek</h2>
        <input type="text" id="mealName" placeholder="Nazwa posiłku (np. Owsianka)">
        <input type="number" id="mealKcal" placeholder="Kalorie (kcal)">
        <button class="btn-main" onclick="addMeal()">Dodaj do bilansu</button>
    </div>

    <div class="card">
        <h2>Dzisiejsze Posiłki</h2>
        <div id="mealsList" style="font-size: 0.85rem; color: #7a8b99;">
            Brak zapisanego jedzenia na dziś.
        </div>
    </div>

    <script>
        // Tryb ciemny - synchronizowany z resztą aplikacji
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
        }

        // Prosta obsługa dodawania posiłków
        function addMeal() {
            const name = document.getElementById('mealName').value;
            const kcal = document.getElementById('mealKcal').value;
            if(!name || !kcal) return alert('Wpisz nazwę i kalorie!');

            const todayStr = new Date().toISOString().split('T')[0];
            let meals = JSON.parse(localStorage.getItem(`meals_${todayStr}`) || '[]');
            meals.push({name, kcal: parseInt(kcal)});
            localStorage.setItem(`meals_${todayStr}`, JSON.stringify(meals));

            document.getElementById('mealName').value = '';
            document.getElementById('mealKcal').value = '';
            loadMeals();
        }

        function loadMeals() {
            const todayStr = new Date().toISOString().split('T')[0];
            let meals = JSON.parse(localStorage.getItem(`meals_${todayStr}`) || '[]');
            const listEl = document.getElementById('mealsList');
            
            if(meals.length === 0) {
                listEl.innerHTML = 'Brak zapisanego jedzenia na dziś.';
                return;
            }

            let html = '<ul style="padding-left: 20px; margin: 0;">';
            meals.forEach(m => {
                html += `<li><b>${m.name}</b>: ${m.kcal} kcal</li>`;
            });
            html += '</ul>';
            listEl.innerHTML = html;
        }

        loadMeals();
    </script>
</body>
</html>
