<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4caf5b">
    <title>Dziennik — Moje posiłki</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
    <script src="diary.js" defer></script>
</head>
<body class="app-page">
    <header class="app-header">
        <h1 class="page-title" style="margin:0">Dziennik</h1>
        <div class="header-actions">
            <button class="icon-button" type="button" onclick="toggleDarkMode()" aria-label="Przełącz motyw">☾</button>
            <button class="icon-button" id="calendarToggle" type="button" aria-label="Wybierz datę">▦</button>
            <img class="profile-avatar" src="icon.png" alt="Awatar profilu">
        </div>
    </header>

    <main class="page-content">
        <div class="date-toolbar">
            <button id="previousDay" type="button" aria-label="Poprzedni dzień">‹</button>
            <div class="date-current">
                <p class="eyebrow" style="margin:0">Dzienny dziennik</p>
                <strong id="selectedDateLabel"></strong>
            </div>
            <button id="nextDay" type="button" aria-label="Następny dzień">›</button>
        </div>
        <input class="form-control calendar-input" id="datePicker" type="date" aria-label="Wybierz datę" hidden>
        <div class="week-strip" id="weekStrip" aria-label="Wybierz dzień tygodnia"></div>

        <section class="card" id="calories">
            <div class="calorie-summary">
                <span class="muted">Kalorii do spożycia</span><strong id="goalDisplay">2000</strong>
                <span class="muted">Ilość spożytych kalorii</span><strong id="eatenDisplay">0</strong>
            </div>
            <div class="progress-track" role="progressbar" aria-label="Dzienne spożycie kalorii" aria-valuemin="0" aria-valuemax="100" style="margin-top:16px">
                <div class="progress-fill" id="calorieProgress" style="width:0%"></div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px">
                <span class="muted" id="remainingDisplay">Pozostało: 2000 kcal</span>
                <button class="secondary-button" id="changeGoal" type="button">Zmień cel</button>
            </div>
        </section>

        <div id="mealCards"></div>
    </main>

    <nav class="bottom-nav" aria-label="Główna nawigacja">
        <a href="index.html"><span class="nav-icon" aria-hidden="true">◉</span>Ja</a>
        <a href="posilki.html" aria-current="page"><span class="nav-icon" aria-hidden="true">♨</span>Dziennik</a>
        <a href="statystyki.html"><span class="nav-icon" aria-hidden="true">▥</span>Raporty</a>
        <a href="trening.html"><span class="nav-icon" aria-hidden="true">🏃</span>Ćwiczenia</a>
    </nav>
</body>
</html>
