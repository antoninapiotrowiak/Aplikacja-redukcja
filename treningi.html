<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stoper i Trening ⏱️</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text);
        }
    </style>
</head>
<body>

    <!-- PASEK NAWIGACJI -->
    <nav class="top-nav">
        <a href="index.html" class="nav-link">🏠 Główna</a>
        <a href="posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link active">⏱️ Trening</a>
    </nav>

    <!-- STOPER PRZERW I LICZNIK SERII -->
    <div class="card">
        <h2>⏱️ Stoper i Trening</h2>
        
        <div style="text-align: center; margin: 20px 0;">
            <div id="timerDisplay" style="font-size: 2.8rem; font-weight: 800; color: #2c3e50; font-family: monospace;">01:00</div>
            <p style="color: #7a8b99; font-size: 0.85rem; margin-top: 5px;">Liczba ukończonych serii: <span id="setCounter" style="font-weight: bold; color: #4a90e2;">0</span></p>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <button onclick="startTimer(30)" style="flex:1; padding: 10px; border: 1px solid #e1e8ed; border-radius: 10px; background: #f8fafc; font-weight: 600; cursor: pointer;">30s</button>
            <button onclick="startTimer(60)" style="flex:1; padding: 10px; border: 1px solid #e1e8ed; border-radius: 10px; background: #f8fafc; font-weight: 600; cursor: pointer;">60s</button>
            <button onclick="startTimer(90)" style="flex:1; padding: 10px; border: 1px solid #e1e8ed; border-radius: 10px; background: #f8fafc; font-weight: 600; cursor: pointer;">90s</button>
        </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="addSet()" style="flex:2; padding: 12px; border: none; border-radius: 12px; background: #4a90e2; color: #fff; font-weight: bold; cursor: pointer;">+ Zalicz serię ✨</button>
            <button onclick="resetWorkout()" style="flex:1; padding: 12px; border: 1px solid #e1e8ed; border-radius: 12px; background: #fff; color: #7a8b99; font-weight: bold; cursor: pointer;">Reset</button>
        </div>
    </div>

    <script>
        let timerInterval = null;
        let timeLeft = 60;
        let completedSets = parseInt(localStorage.getItem('workoutSets')) || 0;

        const setCounterEl = document.getElementById('setCounter');
        if (setCounterEl) setCounterEl.textContent = completedSets;

        function updateDisplay() {
            const timerEl = document.getElementById('timerDisplay');
            if (!timerEl) return;
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            timerEl.textContent = `${minutes}:${seconds}`;
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            timeLeft = seconds;
            updateDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    const timerEl = document.getElementById('timerDisplay');
                    if (timerEl) timerEl.textContent = "00:00";
                    alert("Koniec przerwy! Czas na kolejną serię 💪");
                }
            }, 1000);
        }

        function addSet() {
            completedSets++;
            const setCounterEl = document.getElementById('setCounter');
            if (setCounterEl) setCounterEl.textContent = completedSets;
            localStorage.setItem('workoutSets', completedSets);
            startTimer(60);
        }

        function resetWorkout() {
            completedSets = 0;
            const setCounterEl = document.getElementById('setCounter');
            if (setCounterEl) setCounterEl.textContent = 0;
            localStorage.removeItem('workoutSets');
            clearInterval(timerInterval);
            timeLeft = 60;
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
