<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4caf5b">
    <title>Raporty — Podsumowanie</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
    <script src="reports.js" defer></script>
</head>
<body class="app-page">
    <header class="app-header">
        <h1 class="page-title" style="margin:0">Raporty</h1>
        <div class="header-actions">
            <button class="icon-button" type="button" onclick="toggleDarkMode()" aria-label="Przełącz motyw">☾</button>
            <img class="profile-avatar" src="icon.png" alt="Awatar profilu">
        </div>
    </header>

    <main>
        <div class="report-tabs" role="tablist" aria-label="Rodzaj raportu">
            <button type="button" role="tab" id="caloriesTab" aria-selected="true" aria-controls="reportPanel" data-report="calories">Kalorie</button>
            <button type="button" role="tab" id="macrosTab" aria-selected="false" aria-controls="reportPanel" data-report="macros">Makro</button>
            <button type="button" role="tab" id="foodsTab" aria-selected="false" aria-controls="reportPanel" data-report="foods">Składniki</button>
        </div>
        <div class="page-content" style="padding-top:0">
            <div class="date-toolbar">
                <button id="previousWeek" type="button" aria-label="Poprzedni tydzień">‹</button>
                <div class="date-current">
                    <p class="eyebrow" style="margin:0">Podsumowanie</p>
                    <strong id="reportPeriod"></strong>
                </div>
                <button id="nextWeek" type="button" aria-label="Następny tydzień">›</button>
            </div>
            <section class="card" id="reportPanel" role="tabpanel" aria-labelledby="caloriesTab" tabindex="0"></section>
        </div>
    </main>

    <nav class="bottom-nav" aria-label="Główna nawigacja">
        <a href="index.html"><span class="nav-icon" aria-hidden="true">◉</span>Ja</a>
        <a href="posilki.html"><span class="nav-icon" aria-hidden="true">♨</span>Dziennik</a>
        <a href="statystyki.html" aria-current="page"><span class="nav-icon" aria-hidden="true">▥</span>Raporty</a>
        <a href="trening.html"><span class="nav-icon" aria-hidden="true">🏃</span>Ćwiczenia</a>
    </nav>
</body>
</html>
