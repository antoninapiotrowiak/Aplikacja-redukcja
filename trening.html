<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trening - Aplikacja Fitness ⏱️</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --accent: #2ecc71;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .btn-google {
            background: #4285F4;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 10px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .btn-main {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .workout-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border: 1px solid #edf2f7;
        }
    </style>
</head>
<body>

    <!-- PASEK UŻYTKOWNIKA -->
    <div class="user-bar">
        <div id="userInfo" style="font-weight: 700; font-size: 0.85rem; color: var(--text);">
            🔒 Niezalogowano
        </div>
        <button id="authBtn" class="btn-google" onclick="handleAuth()">Zaloguj z Google</button>
    </div>

    <!-- NAWIGACJA -->
        <nav class="top-nav" style="display: flex; justify-content: space-around; gap: 4px; overflow-x: auto;">
        <a href="index.html" class="nav-link">🏠 Główna</a>
        <a href="posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link active">⏱️ Trening</a>
        <a href="statystyki.html" class="nav-link">📊 Staty</a>
        <a href="przepisy.html" class="nav-link">🥗 Przepisy</a>
    </nav>


    <!-- DODAWANIE TRENINGU -->
    <div class="card">
        <h2>⏱️ Zapisz Trening</h2>
        
        <select id="workoutType">
            <option value="Silowy">💪 Trening siłowy</option>
            <option value="Cardio">🏃‍♂️ Cardio / Interwały</option>
            <option value="Rozciaganie">🧘‍♀️ Rozciąganie / Joga</option>
            <option value="Inny">🔥 Inny aktywny ruch</option>
        </select>

        <input type="text" id="workoutName" placeholder="Nazwa/Opis (np. Trening nóg)">
        <input type="number" id="workoutDuration" placeholder="Czas trwania (w minutach)">

        <button class="btn-main" onclick="saveWorkout()">💾 Zapisz trening</button>
    </div>

    <!-- LISTA DZISIEJSZYCH TRENINGÓW -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2>📋 Dzisiejsze treningi</h2>
            <strong style="color: var(--primary); font-size: 1rem;" id="totalDurationLabel">0 min</strong>
        </div>

        <div id="workoutsList"></div>
    </div>

    <script>
        function handleAuth() {
            if (window.currentUser) {
                if (typeof window.wylogujZGoogle === "function") window.wylogujZGoogle();
            } else {
                if (typeof window.zalogujZGoogle === "function") window.zalogujZGoogle();
            }
        }

        function saveWorkout() {
            if (!window.currentUser) {
                alert("Zaloguj się przez Google, aby zapisywać treningi!");
                return;
            }

            const type = document.getElementById('workoutType').value;
            const name = document.getElementById('workoutName').value.trim();
            const duration = parseInt(document.getElementById('workoutDuration').value);

            if (!name || isNaN(duration) || duration <= 0) {
                alert("Wpisz poprawną nazwę i czas trwania treningu!");
                return;
            }

            // OZNACZAMY TRENING JAKO ZROBIONY DLA POWIADOMIEŃ
            const todayStr = new Date().toISOString().split('T')[0];
            localStorage.setItem(`workout_${todayStr}`, 'true');

            if (typeof window.zapiszTreningDoFirebase === "function") {
                window.zapiszTreningDoFirebase(type, name, duration);
            }

            document.getElementById('workoutName').value = '';
            document.getElementById('workoutDuration').value = '';
        }

        function renderWorkouts(workouts = []) {
            const container = document.getElementById('workoutsList');
            const totalLabel = document.getElementById('totalDurationLabel');
            if (!container) return;

            container.innerHTML = '';
            let totalMinutes = 0;

            if (!workouts || workouts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#a0b2bc; font-size:0.8rem;">Brak zapisanych treningów na dziś 💤</p>';
                if (totalLabel) totalLabel.textContent = '0 min';
                return;
            }

            const icons = {
                Silowy: '💪',
                Cardio: '🏃‍♂️',
                Rozciaganie: '🧘‍♀️',
                Inny: '🔥'
            };

            workouts.forEach((w) => {
                totalMinutes += parseInt(w.duration) || 0;
                container.innerHTML += `
                    <div class="workout-row">
                        <div>
                            <strong>${icons[w.type] || '⏱️'} ${w.name}</strong>
                            <div style="font-size:0.75rem; color:#7a8b99;">${w.duration} min (${w.type})</div>
                        </div>
                        <button onclick="deleteWorkout('${w.id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>
                `;
            });

            if (totalLabel) totalLabel.textContent = totalMinutes + ' min';
        }

        function deleteWorkout(id) {
            if (typeof window.usunTreningZFirebase === "function") {
                window.usunTreningZFirebase(id);
            }
        }
    </script>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithRedirect, 
            getRedirectResult,
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            deleteDoc, 
            doc,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlD9a5WqfBIYWLh4okyGSI8AY1obeox50",
            authDomain: "mojaaplikacja-6bfaa.firebaseapp.com",
            projectId: "mojaaplikacja-6bfaa",
            storageBucket: "mojaaplikacja-6bfaa.firebasestorage.app",
            messagingSenderId: "586745068789",
            appId: "1:024245da595f9a11b299bc",
            measurementId: "G-M0K7DTZRN1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let unsubscribeSnapshot = null;

        getRedirectResult(auth).catch((error) => {
            console.error("Błąd po przekierowaniu:", error);
        });

        window.zalogujZGoogle = async function() {
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                console.error("Błąd logowania:", error);
                alert("Nie udało się zalogować: " + error.message);
            }
        };

        window.wylogujZGoogle = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Błąd wylogowania:", error);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const userInfo = document.getElementById('userInfo');
            const authBtn = document.getElementById('authBtn');

            if (user) {
                window.currentUser = user;
                userInfo.innerHTML = `👤 ${user.displayName || 'Zalogowano'}`;
                authBtn.textContent = 'Wyloguj';
                authBtn.style.background = '#e74c3c';

                const todayStr = new Date().toLocaleDateString('pl-PL');
                const q = query(
                    collection(db, "treningi"), 
                    where("userId", "==", user.uid),
                    where("date", "==", todayStr)
                );
                
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                
                unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                    let workouts = [];
                    snapshot.forEach((doc) => {
                        workouts.push({ id: doc.id, ...doc.data() });
                    });
                    renderWorkouts(workouts);
                });

            } else {
                window.currentUser = null;
                userInfo.innerHTML = '🔒 Niezalogowano';
                authBtn.textContent = 'Zaloguj z Google';
                authBtn.style.background = '#4285F4';

                if (unsubscribeSnapshot) unsubscribeSnapshot();
                renderWorkouts([]);
            }
        });

        window.zapiszTreningDoFirebase = async function(type, name, duration) {
            if (!window.currentUser) return;

            try {
                const todayStr = new Date().toLocaleDateString('pl-PL');
                await addDoc(collection(db, "treningi"), {
                    userId: window.currentUser.uid,
                    date: todayStr,
                    type: type,
                    name: name,
                    duration: duration,
                    created: new Date().getTime()
                });
            } catch (e) {
                console.error("Błąd zapisu treningu:", e);
            }
        };

        window.usunTreningZFirebase = async function(id) {
            try {
                await deleteDoc(doc(db, "treningi", id));
            } catch (e) {
                console.error("Błąd usuwania treningu:", e);
            }
        };
    </script>
</body>
</html>
