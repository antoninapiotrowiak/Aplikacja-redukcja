<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trening i Stoper - Aplikacja Fitness ⏱️</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --accent: #2ecc71;
            --border: #e1e8ed;
            --danger: #e74c3c;
        }

        body.dark-mode {
            --primary: #5c9ded;
            --primary-light: #1e293b;
            --text: #f1f5f9;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #34d399;
            --border: #334155;
            --danger: #f87171;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 6px 8px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text);
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            margin: 15px 0;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button.action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }

        button.danger-btn {
            background: var(--danger);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #7a8b99;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-light);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- PASEK UŻYTKOWNIKA -->
    <div class="user-bar">
        <div style="font-weight: 700; font-size: 0.85rem;">⏱️ Centrum Treningowe</div>
        <button onclick="toggleDarkMode()" style="background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Przełącz motyw">🌙</button>
    </div>

    <!-- NAWIGACJA -->
    <nav class="top-nav">
        <a href="./index.html" class="nav-link">🏠 Główna</a>
        <a href="./posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="./trening.html" class="nav-link active">⏱️ Trening</a>
        <a href="./statystyki.html" class="nav-link">📊 Staty</a>
        <a href="./przepisy.html" class="nav-link">🥗 Przepisy</a>
    </nav>

    <!-- STOPER -->
    <div class="card">
        <h2>⏱️ Stoper Treningowy</h2>
        <div class="timer-display" id="stopwatchDisplay">00:00:00</div>
        <div class="btn-group">
            <button class="action-btn" id="startStopBtn" onclick="toggleStopwatch()">Start</button>
            <button class="action-btn danger-btn" onclick="resetStopwatch()">Reset</button>
        </div>
    </div>

    <!-- KONFIGURATOR WŁASNEGO TRENINGU -->
    <div class="card">
        <h2>🛠️ Konfigurator Własnego Treningu</h2>
        <div class="form-group">
            <label for="exName">Nazwa ćwiczenia</label>
            <input type="text" id="exName" placeholder="np. Przysiady z wyskokiem">
        </div>
        <div class="form-group">
            <label for="exReps">Liczba powtórzeń / Czas</label>
            <input type="text" id="exReps" placeholder="np. 15 powtórzeń lub 45 sekund">
        </div>
        <button class="action-btn" style="width: 100%; margin-bottom: 15px;" onclick="addExercise()">Dodaj do planu</button>

        <h3 style="font-size: 0.95rem; margin-bottom: 10px; color: var(--text);">Twoje ćwiczenia w planie:</h3>
        <div id="customWorkoutList">
            <div style="font-size: 0.85rem; color: #7a8b99; text-align: center; padding: 10px;">Brak ćwiczeń w spersonalizowanym planie.</div>
        </div>
    </div>

    <script>
        // Tryb ciemny
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
        }

        // --- STOPER LOGIKA ---
        let stopwatchInterval = null;
        let stopwatchSeconds = 0;
        let isRunning = false;

        function toggleStopwatch() {
            const btn = document.getElementById('startStopBtn');
            if (!isRunning) {
                isRunning = true;
                btn.textContent = 'Pauza';
                btn.classList.add('danger-btn');
                stopwatchInterval = setInterval(() => {
                    stopwatchSeconds++;
                    updateStopwatchDisplay();
                }, 1000);
            } else {
                isRunning = false;
                btn.textContent = 'Start';
                btn.classList.remove('danger-btn');
                clearInterval(stopwatchInterval);
            }
        }

        function resetStopwatch() {
            isRunning = false;
            clearInterval(stopwatchInterval);
            stopwatchSeconds = 0;
            updateStopwatchDisplay();
            const btn = document.getElementById('startStopBtn');
            btn.textContent = 'Start';
            btn.classList.remove('danger-btn');
        }

        function updateStopwatchDisplay() {
            const hrs = String(Math.floor(stopwatchSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((stopwatchSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(stopwatchSeconds % 60).padStart(2, '0');
            document.getElementById('stopwatchDisplay').textContent = `${hrs}:${mins}:${secs}`;
        }

        // --- KONFIGURATOR TRENINGU LOGIKA ---
        let customExercises = JSON.parse(localStorage.getItem('customWorkoutExercises')) || [];

        function renderExercises() {
            const listContainer = document.getElementById('customWorkoutList');
            if (customExercises.length === 0) {
                listContainer.innerHTML = '<div style="font-size: 0.85rem; color: #7a8b99; text-align: center; padding: 10px;">Brak ćwiczeń w spersonalizowanym planie.</div>';
                return;
            }

            listContainer.innerHTML = '';
            customExercises.forEach((ex, index) => {
                listContainer.innerHTML += `
                    <div class="exercise-item">
                        <div>
                            <strong>${ex.name}</strong><br>
                            <span style="color: #7a8b99; font-size: 0.75rem;">${ex.reps}</span>
                        </div>
                        <button onclick="removeExercise(${index})" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:1rem;" title="Usuń">🗑️</button>
                    </div>
                `;
            });
        }

        function addExercise() {
            const nameInput = document.getElementById('exName');
            const repsInput = document.getElementById('exReps');

            if (!nameInput.value.trim() || !repsInput.value.trim()) {
                alert('Wpisz nazwę i powtórzenia/czas ćwiczenia!');
                return;
            }

            customExercises.push({
                name: nameInput.value.trim(),
                reps: repsInput.value.trim()
            });

            localStorage.setItem('customWorkoutExercises', JSON.stringify(customExercises));
            nameInput.value = '';
            repsInput.value = '';
            renderExercises();
        }

        function removeExercise(index) {
            customExercises.splice(index, 1);
            localStorage.setItem('customWorkoutExercises', JSON.stringify(customExercises));
            renderExercises();
        }

        // Załaduj ćwiczenia przy starcie
        renderExercises();
    </script>
</body>
</html>
