<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trening i Stoper ⏱️</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* NAWIGACJA (Tylko Główna, Posiłki, Trening) */
        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text);
        }

        .preset-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #e1e8ed;
            border-radius: 14px;
            background: #fff;
            font-weight: 800;
            font-size: 0.95rem;
            color: #5a6e7f;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }

        .ex-card {
            background: #f8fafc;
            border: 1px solid #edf2f7;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .ex-title {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .set-btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .set-btn {
            padding: 6px 12px;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            background: #fff;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .set-btn.done {
            background: #4a90e2;
            color: #fff;
            border-color: #4a90e2;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-outline {
            background: transparent;
            color: #7a8b99;
            border: 1px solid #e1e8ed;
        }
    </style>
</head>
<body>

    <!-- PASEK NAWIGACJI -->
    <nav class="top-nav">
        <a href="index.html" class="nav-link">🏠 Główna</a>
        <a href="posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link active">⏱️ Trening</a>
    </nav>

    <!-- STOPER PRZERW -->
    <div class="card">
        <h2>⏱️ Stoper Przerw</h2>
        <div style="text-align: center; margin-bottom: 12px;">
            <div id="timerDisplay" style="font-size: 2.8rem; font-weight: 800; color: #2c3e50; font-family: monospace;">01:00</div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button onclick="startTimer(30)" style="flex:1; padding: 8px; border: 1px solid #e1e8ed; border-radius: 10px; background: #f8fafc; font-weight: 600; cursor: pointer;">30s</button>
            <button onclick="startTimer(60)" style="flex:1; padding: 8px; border: 1px solid #e1e8ed; border-radius: 10px; background: #f8fafc; font-weight: 600; cursor: pointer;">60s</button>
            <button onclick="startTimer(90)" style="flex:1; padding: 8px; border: 1px solid #e1e8ed; border-radius: 10px; background: #f8fafc; font-weight: 600; cursor: pointer;">90s</button>
        </div>
    </div>

    <!-- WYBÓR GOTOWEGO PLANU -->
    <div class="card">
        <h2>🏋️ Wybierz Plan Treningu</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="preset-btn active" id="btnNormal" onclick="selectPlan('normal')">⚡ Normalny</button>
            <button class="preset-btn" id="btnLazy" onclick="selectPlan('lazy')">☁️ Na Lenia</button>
        </div>

        <!-- LISTA ĆWICZEŃ Z AUTOMATYCZNYMI SERIAMI -->
        <div id="workoutExercises"></div>
    </div>

    <!-- KONFIGURATOR 3. TRENINGU (WŁASNEGO) -->
    <div class="card">
        <h2>🛠️ Konfigurator 3. Treningu (Własny)</h2>
        <p style="font-size: 0.8rem; color: #7a8b99; margin-top: -10px; margin-bottom: 12px;">Ułóż własny zestaw ćwiczeń, jeśli chcesz spróbować czegoś innego:</p>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="customExInput" placeholder="Nazwa ćwiczenia (np. Hip Thrust)" style="margin: 0;">
            <button class="btn" onclick="addCustomExercise()">Dodaj</button>
        </div>
        <div id="customExercisesList" style="margin-top: 12px;"></div>
    </div>

    <!-- HISTORIA WSZYSTKICH TRENINGÓW -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2>📝 Historia Wszystkich Serii (<span id="totalSets">0</span>)</h2>
            <button class="btn btn-outline" style="padding: 4px 8px; font-size: 0.75rem;" onclick="clearHistory()">Wyczyść</button>
        </div>
        <div id="historyList"></div>
    </div>

    <script>
        // Plany treningowe
        const plans = {
            normal: ["Przysiady", "Wykroki", "Pompki / Odwrotne pompki", "Glute Bridge", "Plank (Deska)"],
            lazy: ["Glute Bridge leżąc", "Wznosy nóg w leżeniu", "Rozciąganie / Cat-Cow", "Plank 30 sekund"]
        };

        let currentPlanKey = 'normal';
        let customExercises = JSON.parse(localStorage.getItem('customWorkoutPlan')) || [];
        let history = JSON.parse(localStorage.getItem('workoutHistoryLog')) || [];
        let completedSetsTracker = JSON.parse(localStorage.getItem('completedSetsTracker')) || {};

        let timerInterval = null;
        let timeLeft = 60;

        function selectPlan(planKey) {
            currentPlanKey = planKey;
            document.getElementById('btnNormal').classList.toggle('active', planKey === 'normal');
            document.getElementById('btnLazy').classList.toggle('active', planKey === 'lazy');
            renderWorkout();
        }

        function renderWorkout() {
            const container = document.getElementById('workoutExercises');
            container.innerHTML = '';
            
            let exercises = plans[currentPlanKey];

            exercises.forEach((ex, exIdx) => {
                let setsHtml = '';
                for (let s = 1; s <= 3; s++) {
                    const setKey = `${currentPlanKey}_${exIdx}_${s}`;
                    const isDone = completedSetsTracker[setKey] ? 'done' : '';
                    setsHtml += `<button class="set-btn ${isDone}" onclick="logSet('${ex}', ${s}, '${setKey}')">Seria ${s}</button>`;
                }

                container.innerHTML += `
                    <div class="ex-card">
                        <div class="ex-title">${ex}</div>
                        <div class="set-btn-group">${setsHtml}</div>
                    </div>
                `;
            });
        }

        function logSet(exName, setNum, setKey) {
            // Oznaczenie zestawu jako zaliczony
            completedSetsTracker[setKey] = true;
            localStorage.setItem('completedSetsTracker', JSON.stringify(completedSetsTracker));

            // Zapis w historii
            const timeStr = new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
            history.unshift({ name: exName, set: setNum, time: timeStr });
            localStorage.setItem('workoutHistoryLog', JSON.stringify(history));

            renderWorkout();
            renderCustomExercises();
            renderHistory();
            startTimer(60); // Automatycznie odpala stoper
        }

        // KONFIGURATOR 3. TRENINGU
        function addCustomExercise() {
            const input = document.getElementById('customExInput');
            if (input.value.trim() !== '') {
                customExercises.push(input.value.trim());
                localStorage.setItem('customWorkoutPlan', JSON.stringify(customExercises));
                input.value = '';
                renderCustomExercises();
            }
        }

        function removeCustomEx(index) {
            customExercises.splice(index, 1);
            localStorage.setItem('customWorkoutPlan', JSON.stringify(customExercises));
            renderCustomExercises();
        }

        function renderCustomExercises() {
            const container = document.getElementById('customExercisesList');
            container.innerHTML = '';

            if (customExercises.length === 0) {
                container.innerHTML = '<p style="color:#a0b2bc; font-size:0.8rem; text-align:center;">Brak własnych ćwiczeń. Dodaj pierwsze powyżej! ☁️</p>';
                return;
            }

            customExercises.forEach((ex, exIdx) => {
                let setsHtml = '';
                for (let s = 1; s <= 3; s++) {
                    const setKey = `custom_${exIdx}_${s}`;
                    const isDone = completedSetsTracker[setKey] ? 'done' : '';
                    setsHtml += `<button class="set-btn ${isDone}" onclick="logSet('${ex}', ${s}, '${setKey}')">Seria ${s}</button>`;
                }

                container.innerHTML += `
                    <div class="ex-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="ex-title">${ex}</div>
                            <button onclick="removeCustomEx(${exIdx})" style="background:none; border:none; cursor:pointer;">🗑️</button>
                        </div>
                        <div class="set-btn-group">${setsHtml}</div>
                    </div>
                `;
            });
        }

        // HISTORIA
        function renderHistory() {
            const container = document.getElementById('historyList');
            document.getElementById('totalSets').textContent = history.length;
            container.innerHTML = '';

            if (history.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#a0b2bc; font-size:0.85rem; padding:10px;">Brak historii treningów ☁️</p>';
                return;
            }

            history.forEach(item => {
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#fafcfe; border-radius:10px; margin-bottom:6px; border:1px solid #edf4f8;">
                        <span style="font-weight:700; color:#4a90e2; font-size:0.85rem;">${item.name} — Seria ${item.set}</span>
                        <span style="font-size:0.75rem; color:#a0b2bc;">${item.time}</span>
                    </div>
                `;
            });
        }

        function clearHistory() {
            if (confirm("Chcesz wyczyścić historię i zresetować oznaczone serie?")) {
                history = [];
                completedSetsTracker = {};
                localStorage.removeItem('workoutHistoryLog');
                localStorage.removeItem('completedSetsTracker');
                renderWorkout();
                renderCustomExercises();
                renderHistory();
            }
        }

        // STOPER
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${minutes}:${seconds}`;
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            timeLeft = seconds;
            updateDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerDisplay').textContent = "00:00";
                    alert("Koniec przerwy! Czas na kolejną serię 💪");
                }
            }, 1000);
        }

        // START
        renderWorkout();
        renderCustomExercises();
        renderHistory();
        updateDisplay();
    </script>
</body>
</html>
