<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trening - Aplikacja Fitness ⏱️</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --accent: #2ecc71;
            --border: #e1e8ed;
        }

        body.dark-mode {
            --primary: #5c9ded;
            --primary-light: #1e293b;
            --text: #f1f5f9;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #34d399;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 6px 8px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .workout-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--primary-light);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <!-- PASEK UŻYTKOWNIKA -->
    <div class="user-bar">
        <div style="font-weight: 700; font-size: 0.85rem;">⏱️ Strefa Treningu</div>
        <button onclick="toggleDarkMode()" style="background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Przełącz motyw">🌙</button>
    </div>

    <!-- NAWIGACJA -->
        <nav class="top-nav" style="display: flex; justify-content: space-around; gap: 4px; overflow-x: auto;">
        <a href="index.html" class="nav-link">🏠 Główna</a>
        <a href="posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link active">⏱️ Trening</a>
        <a href="statystyki.html" class="nav-link">📊 Staty</a>
        <a href="przepisy.html" class="nav-link">🥗 Przepisy</a>
    </nav>


    <!-- WYBÓR / ZAPIS TRENINGU -->
    <div class="card">
        <h2>💪 Zarejestruj Trening</h2>
        <button class="btn-main" onclick="logWorkout('Trening Siłowy / Fitness')">🏋️ Zrobiono Trening Siłowy</button>
        <button class="btn-main" onclick="logWorkout('Cardio / Interwały')" style="background:var(--accent);">🏃 Zrobiono Cardio / Spacer</button>
    </div>

    <!-- HISTORIA TRENINGÓW -->
    <div class="card">
        <h2>📋 Dzisiejsze Aktywności</h2>
        <div id="workoutList">
            <p style="text-align:center; color:#7a8b99; font-size:0.85rem;">Brak zapisanych treningów na dziś.</p>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
        }

        let workouts = JSON.parse(localStorage.getItem('savedWorkouts')) || [];

        function logWorkout(type) {
            const todayStr = new Date().toISOString().split('T')[0];
            const newWorkout = { id: Date.now(), type, date: todayStr };

            workouts.push(newWorkout);
            localStorage.setItem('savedWorkouts', JSON.stringify(workouts));

            // Odznaczamy powiadomienie treningowe jako zrobione na dziś
            localStorage.setItem(`workout_${todayStr}`, 'done');

            renderWorkouts();
            alert(`Świetnie! Zapisano aktywność: ${type} 🎉`);
        }

        function deleteWorkout(id) {
            workouts = workouts.filter(w => w.id !== id);
            localStorage.setItem('savedWorkouts', JSON.stringify(workouts));
            renderWorkouts();
        }

        function renderWorkouts() {
            const container = document.getElementById('workoutList');
            const todayStr = new Date().toISOString().split('T')[0];
            const todayWorkouts = workouts.filter(w => w.date === todayStr);

            container.innerHTML = '';
            if (todayWorkouts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#7a8b99; font-size:0.85rem;">Brak zapisanych treningów na dziś.</p>';
                return;
            }

            todayWorkouts.forEach(w => {
                container.innerHTML += `
                    <div class="workout-row">
                        <div><b>${w.type}</b></div>
                        <button onclick="deleteWorkout(${w.id})" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>
                `;
            });
        }

        renderWorkouts();
    </script>
</body>
</html>
