<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statystyki - Aplikacja Fitness 📊</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --accent: #2ecc71;
            --border: #e1e8ed;
        }

        body.dark-mode {
            --primary: #5c9ded;
            --primary-light: #1e293b;
            --text: #f1f5f9;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #34d399;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .btn-google {
            background: #4285F4;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 10px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: var(--primary-light);
            padding: 15px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- PASEK UŻYTKOWNIKA -->
    <div class="user-bar">
        <div id="userInfo" style="font-weight: 700; font-size: 0.85rem; color: var(--text);">
            🔒 Niezalogowano
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button onclick="toggleDarkMode()" style="background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Przełącz motyw">🌙</button>
            <button id="authBtn" class="btn-google" onclick="handleAuth()">Zaloguj</button>
        </div>
    </div>

    <!-- NAWIGACJA -->
    <nav class="top-nav">
        <a href="index.html" class="nav-link">🏠 Główna</a>
        <a href="posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link">⏱️ Trening</a>
        <a href="statystyki.html" class="nav-link active">📊 Statystyki</a>
    </nav>

    <!-- PODSUMOWANIE STATYSTYK -->
    <div class="card">
        <h2>📊 Twoje Podsumowanie</h2>
        <div class="stat-grid">
            <div class="stat-box">
                <div style="font-size:0.8rem; color:#7a8b99; font-weight:600;">Cel Kaloryczny</div>
                <div class="stat-value" id="statGoalKcal">2000 kcal</div>
            </div>
            <div class="stat-box">
                <div style="font-size:0.8rem; color:#7a8b99; font-weight:600;">Ostatni Nastrój</div>
                <div class="stat-value" id="statLastMood">-</div>
            </div>
        </div>
    </div>

    <!-- HISTORIA NASTROJÓW -->
    <div class="card">
        <h2>✨ Ostatnie Samopoczucie</h2>
        <div id="moodHistoryList" style="font-size: 0.85rem; color: #7a8b99;">
            Brak zapisanych nastrojów w pamięci lokalnej.
        </div>
    </div>

    <script>
        // Tryb ciemny synchronizowany z resztą aplikacji
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
        }

        function handleAuth() {
            if (window.currentUser) {
                if (typeof window.wylogujZGoogle === "function") window.wylogujZGoogle();
            } else {
                if (typeof window.zalogujZGoogle === "function") window.zalogujZGoogle();
            }
        }

        // Ładowanie danych do statystyk z localStorage
        function loadStatsData() {
            const goal = localStorage.getItem('userCalorieGoal') || 2000;
            document.getElementById('statGoalKcal').textContent = goal + ' kcal';

            // Sprawdzamy dzisiejszy nastrój
            const todayStr = new Date().toISOString().split('T')[0];
            const savedMood = localStorage.getItem(`mood_${todayStr}`);
            const moodContainer = document.getElementById('moodHistoryList');
            const lastMoodDisplay = document.getElementById('statLastMood');

            if (savedMood) {
                const mood = JSON.parse(savedMood);
                lastMoodDisplay.innerHTML = `${mood.emoji}`;
                moodContainer.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--primary-light); padding:10px; border-radius:10px; border:1px solid var(--border);">
                        <span>Dzisiaj (${mood.date}):</span>
                        <span style="font-size:1.2rem;">${mood.emoji} <b>${mood.label}</b></span>
                    </div>
                `;
            }
        }

        loadStatsData();
    </script>
</body>
</html>
