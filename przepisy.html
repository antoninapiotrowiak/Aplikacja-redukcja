<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przepisy - Aplikacja Fitness 🥗</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --accent: #2ecc71;
            --border: #e1e8ed;
        }

        body.dark-mode {
            --primary: #5c9ded;
            --primary-light: #1e293b;
            --text: #f1f5f9;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #34d399;
            --border: #334155;
        }

        body.dark-mode input, body.dark-mode select, body.dark-mode textarea {
            background: #0f172a;
            color: #f1f5f9;
            border-color: var(--border);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 6px 8px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .recipe-item {
            padding: 12px;
            background: var(--primary-light);
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .recipe-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .recipe-meta {
            font-size: 0.75rem;
            color: #7a8b99;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- PASEK UŻYTKOWNIKA -->
    <div class="user-bar">
        <div style="font-weight: 700; font-size: 0.85rem;">🥗 Baza i Konfigurator Przepisów</div>
        <button onclick="toggleDarkMode()" style="background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Przełącz motyw">🌙</button>
    </div>

    <!-- NAWIGACJA -->
    <nav class="top-nav">
        <a href="index.html" class="nav-link">🏠 Główna</a>
        <a href="posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link">⏱️ Trening</a>
        <a href="statystyki.html" class="nav-link">📊 Staty</a>
        <a href="przepisy.html" class="nav-link active">🥗 Przepisy</a>
    </nav>

    <!-- KONFIGURATOR / DODAWANIE PRZEPISU -->
    <div class="card">
        <h2>➕ Dodaj Własny Przepis</h2>
        <input type="text" id="recipeName" placeholder="Nazwa przepisu (np. Owsianka bananowa)">
        <select id="recipeCategory">
            <option value="Śniadania">Śniadania / Na słodko</option>
            <option value="Airfryer">Airfryer / Szybkie</option>
            <option value="Obiady">Obiady / Główne</option>
            <option value="Przekąski">Przekąski</option>
        </select>
        <input type="number" id="recipeKcal" placeholder="Szacowane kalorie (kcal)">
        <textarea id="recipeDesc" placeholder="Krótki opis lub składniki..."></textarea>
        <button class="btn-main" onclick="addRecipe()">Zapisz przepis</button>
    </div>

    <!-- WYSZUKIWARKA -->
    <div class="card">
        <h2>🔍 Szukaj w przepisach</h2>
        <input type="text" id="searchInput" placeholder="Wpisz szukaną frazę..." onkeyup="filterRecipes()">
    </div>

    <!-- LISTA PRZEPISÓW -->
    <div class="card">
        <h2>📋 Twoje Przepisy i Inspiracje</h2>
        <div id="recipesContainer">
            <!-- Tutaj wskakują przepisy -->
        </div>
    </div>

    <script>
        // Tryb ciemny
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
        }

        // Baza przepisów w localStorage
        let recipes = JSON.parse(localStorage.getItem('userRecipes')) || [
            { id: 1, name: "Czekoladowe ciastko z airfryera", category: "Airfryer", kcal: 250, desc: "Szybka porcja słodkości w 10 minut. Wymieszaj i do airfryera!" },
            { id: 2, name: "Pieczona owsianka z owocami", category: "Śniadania", kcal: 320, desc: "Ciepłe, sycące śniadanie na dobry początek dnia." },
            { id: 3, name: "Chrupiący Camembert z warzywami", category: "Przekąski", kcal: 380, desc: "Rozgrzany serek na ciepło z ulubionymi dodatkami." }
        ];

        function addRecipe() {
            const name = document.getElementById('recipeName').value;
            const category = document.getElementById('recipeCategory').value;
            const kcal = parseInt(document.getElementById('recipeKcal').value);
            const desc = document.getElementById('recipeDesc').value;

            if (!name || isNaN(kcal)) {
                alert("Podaj przynajmniej nazwę i kalorie!");
                return;
            }

            const newRecipe = { id: Date.now(), name, category, kcal, desc };
            recipes.unshift(newRecipe);
            localStorage.setItem('userRecipes', JSON.stringify(recipes));

            document.getElementById('recipeName').value = '';
            document.getElementById('recipeKcal').value = '';
            document.getElementById('recipeDesc').value = '';
            renderRecipes();
        }

        function deleteRecipe(id) {
            recipes = recipes.filter(r => r.id !== id);
            localStorage.setItem('userRecipes', JSON.stringify(recipes));
            renderRecipes();
        }

        function renderRecipes() {
            const container = document.getElementById('recipesContainer');
            container.innerHTML = '';

            if (recipes.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#7a8b99; font-size:0.85rem;">Brak zapisanych przepisów.</p>';
                return;
            }

            recipes.forEach(r => {
                container.innerHTML += `
                    <div class="recipe-item" data-search="${r.name.toLowerCase()} ${r.category.toLowerCase()} ${r.desc.toLowerCase()}">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div class="recipe-title">${r.name}</div>
                            <button onclick="deleteRecipe(${r.id})" style="background:none; border:none; cursor:pointer; font-size:0.9rem;" title="Usuń">🗑️</button>
                        </div>
                        <div class="recipe-meta">Kategoria: <b>${r.category}</b> | ⚡ ${r.kcal} kcal</div>
                        <div style="color: var(--text);">${r.desc || 'Brak opisu.'}</div>
                    </div>
                `;
            });
        }

        function filterRecipes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.recipe-item');

            items.forEach(item => {
                const searchData = item.getAttribute('data-search');
                if (searchData.includes(query)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        renderRecipes();
    </script>
</body>
</html>
