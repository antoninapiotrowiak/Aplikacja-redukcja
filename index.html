<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4caf5b">
    <title>Ja — Mój Dziennik</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
    <script src="profile.js" defer></script>
</head>
<body class="app-page">
    <header class="app-header">
        <h1 class="page-title" style="margin:0">Ja</h1>
        <div class="header-actions">
            <button class="icon-button" type="button" onclick="toggleDarkMode()" aria-label="Przełącz motyw">☾</button>
            <img class="profile-avatar" src="icon.png" alt="Awatar profilu">
        </div>
    </header>

    <main class="page-content">
        <section class="card">
            <div class="profile-summary">
                <img class="profile-avatar" src="icon.png" alt="">
                <div>
                    <p class="eyebrow">Mój profil</p>
                    <h2 class="profile-name">Twoja droga do celu</h2>
                    <p class="muted" style="margin:0">Małe kroki, regularne postępy.</p>
                </div>
            </div>
            <div class="stat-pills">
                <div class="stat-pill"><span class="muted">Zjedzone dzisiaj</span><strong id="profileCalories">0 kcal</strong></div>
                <div class="stat-pill"><span class="muted">Dzisiejszy cel</span><strong id="profileCalorieGoal">2000 kcal</strong></div>
            </div>
            <a class="primary-button" href="posilki.html" style="display:block;text-align:center;text-decoration:none">Otwórz dziennik</a>
        </section>

        <section class="card">
            <p class="eyebrow">Twoje postępy</p>
            <h2>Moja waga</h2>
            <div class="weight-range">
                <span>Start: <span id="startingWeight">—</span></span>
                <strong id="currentWeight">—</strong>
                <span>Cel: <span id="targetWeight">—</span></span>
            </div>
            <div class="progress-track" role="progressbar" aria-label="Postęp do celu wagowego" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-fill" id="weightProgress" style="width:0%"></div>
            </div>
            <form id="weightForm" style="margin-top:18px">
                <div class="form-grid">
                    <div class="field">
                        <label class="field-label" for="weightInput">Zapisz wagę (kg)</label>
                        <input class="form-control" id="weightInput" name="weight" type="number" min="1" max="500" step="0.1" inputmode="decimal" placeholder="np. 70,5">
                    </div>
                    <div class="field">
                        <label class="field-label" for="weightTargetInput">Cel wagowy (kg)</label>
                        <input class="form-control" id="weightTargetInput" name="target" type="number" min="1" max="500" step="0.1" inputmode="decimal" placeholder="Ustaw cel">
                    </div>
                </div>
                <button class="secondary-button" type="submit" style="width:100%;margin-top:12px">Zapisz postępy</button>
                <p id="weightMessage" class="muted" aria-live="polite" style="margin:10px 0 0"></p>
            </form>
            <div id="weightHistory" style="margin-top:12px"></div>
        </section>

        <section class="card settings-list" aria-label="Ustawienia i skróty">
            <a class="settings-link" href="index.html#weightForm">
                <span class="settings-icon" aria-hidden="true">⚖</span>
                <span style="flex:1">Moja waga</span><span class="muted" aria-hidden="true">›</span>
            </a>
            <a class="settings-link" href="posilki.html#calories">
                <span class="settings-icon" aria-hidden="true">◎</span>
                <span style="flex:1">Moje kalorie i cele</span><span class="muted" aria-hidden="true">›</span>
            </a>
            <a class="settings-link" href="statystyki.html">
                <span class="settings-icon" aria-hidden="true">☆</span>
                <span style="flex:1">Moje podsumowanie</span><span class="muted" aria-hidden="true">›</span>
            </a>
            <a class="settings-link" href="przepisy.html">
                <span class="settings-icon" aria-hidden="true">▤</span>
                <span style="flex:1">Przepisy i kalkulator</span><span class="muted" aria-hidden="true">›</span>
            </a>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Główna nawigacja">
        <a href="index.html" aria-current="page"><span class="nav-icon" aria-hidden="true">◉</span>Ja</a>
        <a href="posilki.html"><span class="nav-icon" aria-hidden="true">♨</span>Dziennik</a>
        <a href="statystyki.html"><span class="nav-icon" aria-hidden="true">▥</span>Raporty</a>
        <a href="trening.html"><span class="nav-icon" aria-hidden="true">🏃</span>Ćwiczenia</a>
    </nav>
</body>
</html>
