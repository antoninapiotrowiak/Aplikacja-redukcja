<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja Fitness 🌟</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
            --accent: #2ecc71;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .btn-google {
            background: #4285F4;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 10px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--text);
        }

        .progress-bar-bg {
            background: #e1e8ed;
            height: 16px;
            border-radius: 10px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn-main {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--primary);
            border-radius: 10px;
            background: transparent;
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            border: 1px solid #edf2f7;
        }
    </style>
</head>
<body>

    <!-- PASEK UŻYTKOWNIKA -->
    <div class="user-bar">
        <div id="userInfo" style="font-weight: 700; font-size: 0.85rem; color: var(--text);">
            🔒 Niezalogowano
        </div>
        <button id="authBtn" class="btn-google" onclick="handleAuth()">Zaloguj z Google</button>
    </div>

    <!-- NAWIGACJA -->
    <nav class="top-nav">
        <a href="index.html" class="nav-link active">🏠 Główna</a>
        <a href="posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link">⏱️ Trening</a>
        <a href="przepisy.html" class="nav-link">🥗 Przepisy</a>
    </nav>

    <!-- KARTA POWIADOMIEŃ PRZYPOMINAJĄCYCH -->
    <div class="card">
        <h2>🔔 Przypomnienia i Powiadomienia</h2>
        <p style="font-size:0.8rem; color:#7a8b99; margin-bottom:12px;">
            Włącz interaktywne powiadomienia, aby nie zapomnieć o wpisaniu kalorii oraz o treningu!
        </p>
        <button class="btn-main" onclick="requestNotificationPermission()">⚡ Włącz powiadomienia</button>
        <div style="display:flex; gap:8px;">
            <button class="btn-secondary" onclick="testMealNotification()">🍽️ Test Posiłków</button>
            <button class="btn-secondary" onclick="testWorkoutNotification()">⏱️ Test Treningu</button>
        </div>
    </div>

    <!-- CELE I PASEK POSTĘPU KALORII -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>🎯 Cel Kaloryczny</h2>
            <button onclick="setCalorieGoal()" style="background:none; border:none; color:var(--primary); font-weight:700; cursor:pointer; font-size:0.8rem;">⚙️ Zmień cel</button>
        </div>

        <div style="font-size: 1.4rem; font-weight: 800; color: #2c3e50; margin-top: 5px;">
            <span id="currentKcalDisplay">0</span> / <span id="goalKcalDisplay">2000</span> kcal
        </div>

        <div class="progress-bar-bg">
            <div id="kcalProgressBar" class="progress-bar-fill"></div>
        </div>

        <div style="font-size: 0.85rem; color: #7a8b99; font-weight: 600;" id="kcalStatusText">
            Zostało: 2000 kcal
        </div>
    </div>

    <!-- ŚLEDZIK WAGI I WYMIARÓW -->
    <div class="card">
        <h2>📈 Waga i Wymiary</h2>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="weightInput" step="0.1" placeholder="Waga (kg)">
            <input type="number" id="waistInput" placeholder="Talia (cm)">
        </div>
        <button class="btn-main" onclick="saveMeasurement()">💾 Zapisz pomiar</button>

        <div id="measurementsHistory" style="margin-top: 15px;"></div>
    </div>

    <!-- SKRYPT INTERFEJSU I POWIADOMIEŃ -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker zarejestrowany!'))
                .catch(err => console.error('Błąd rejestracji SW:', err));
        }

        async function requestNotificationPermission() {
            if (!('Notification' in window)) {
                alert('Twoja przeglądarka nie obsługuje powiadomień.');
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                alert('Super! Powiadomienia zostały włączone 🎉');
            } else if (permission === 'denied') {
                alert('Powiadomienia zostały zablokowane w ustawieniach przeglądarki.');
            }
        }

        async function testMealNotification() {
            if (Notification.permission !== 'granted') {
                await requestNotificationPermission();
            }

            if (Notification.permission === 'granted' && navigator.serviceWorker.ready) {
                const reg = await navigator.serviceWorker.ready;
                reg.showNotification('Czas na wpisanie posiłku! 🍽️', {
                    body: 'Jak tam dzisiejszy bilans kalorii? Uzupełnij swoje posiłki!',
                    vibrate: [200, 100, 200],
                    requireInteraction: true,
                    data: { url: '/posilki.html' },
                    actions: [
                        { action: 'open-posilki', title: '🍽️ Zapisz posiłki' },
                        { action: 'snooze', title: '⏰ Za godzinę' }
                    ]
                });
            }
        }

        async function testWorkoutNotification() {
            if (Notification.permission !== 'granted') {
                await requestNotificationPermission();
            }

            if (Notification.permission === 'granted' && navigator.serviceWorker.ready) {
                const reg = await navigator.serviceWorker.ready;
                reg.showNotification('Czas na dzisiejszy trening! ⏱️', {
                    body: 'Gotowa na małą aktywność? Ruszajmy po formę!',
                    vibrate: [300, 100, 300],
                    requireInteraction: true,
                    data: { url: '/trening.html' },
                    actions: [
                        { action: 'open-trening', title: '⏱️ Rozpocznij trening' },
                        { action: 'snooze', title: '⏰ Później' }
                    ]
                });
            }
        }

        let calorieGoal = parseInt(localStorage.getItem('userCalorieGoal')) || 2000;

        function updateCalorieUI() {
            const todayKcal = parseInt(localStorage.getItem('todayCalories')) || 0;
            const currentDisplay = document.getElementById('currentKcalDisplay');
            const goalDisplay = document.getElementById('goalKcalDisplay');

            if (currentDisplay) currentDisplay.textContent = todayKcal;
            if (goalDisplay) goalDisplay.textContent = calorieGoal;

            const percent = Math.min(Math.round((todayKcal / calorieGoal) * 100), 100);
            const bar = document.getElementById('kcalProgressBar');
            if (bar) bar.style.width = percent + '%';

            const remaining = calorieGoal - todayKcal;
            const status = document.getElementById('kcalStatusText');

            if (status && bar) {
                if (remaining > 0) {
                    status.textContent = `Pozostało do wykorzystania: ${remaining} kcal`;
                    bar.style.backgroundColor = '#4a90e2';
                } else if (remaining === 0) {
                    status.textContent = `Idealnie! Osiągnięto dzisiejszy cel! 🎉`;
                    bar.style.backgroundColor = '#2ecc71';
                } else {
                    status.textContent = `Przekroczono cel o ${Math.abs(remaining)} kcal ⚡`;
                    bar.style.backgroundColor = '#e74c3c';
                }
            }
        }

        function setCalorieGoal() {
            const newGoal = prompt("Wpisz swój dzienny cel kalorii (kcal):", calorieGoal);
            if (newGoal && !isNaN(newGoal) && newGoal > 0) {
                calorieGoal = parseInt(newGoal);
                localStorage.setItem('userCalorieGoal', calorieGoal);
                updateCalorieUI();
            }
        }

        function handleAuth() {
            if (window.currentUser) {
                if (typeof window.wylogujZGoogle === "function") window.wylogujZGoogle();
            } else {
                if (typeof window.zalogujZGoogle === "function") window.zalogujZGoogle();
            }
        }

        function saveMeasurement() {
            if (!window.currentUser) {
                alert("Zaloguj się przez Google, aby zapisywać swoje pomiary!");
                return;
            }

            const weight = document.getElementById('weightInput').value;
            const waist = document.getElementById('waistInput').value;

            if (!weight && !waist) {
                alert("Wpisz przynajmniej wagę lub obwód talii!");
                return;
            }

            if (typeof window.zapiszPomiarDoFirebase === "function") {
                window.zapiszPomiarDoFirebase(weight, waist);
            }

            document.getElementById('weightInput').value = '';
            document.getElementById('waistInput').value = '';
        }

        function renderMeasurements(data = []) {
            const container = document.getElementById('measurementsHistory');
            if (!container) return;

            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#a0b2bc; font-size:0.8rem;">Brak zapisanych pomiarów ☁️</p>';
                return;
            }

            data.forEach((m) => {
                container.innerHTML += `
                    <div class="history-row">
                        <strong style="color:var(--primary);">${m.date}</strong>
                        <span>${m.weight ? '⚖️ ' + m.weight + ' kg' : ''} ${m.waist ? '📏 ' + m.waist + ' cm' : ''}</span>
                        <button onclick="deleteMeasurement('${m.id}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>
                `;
            });
        }

        function deleteMeasurement(id) {
            if (typeof window.usunPomiarZFirebase === "function") {
                window.usunPomiarZFirebase(id);
            }
        }

        updateCalorieUI();
    </script>

    <!-- MODULE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithRedirect, 
            getRedirectResult,
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            deleteDoc, 
            doc,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlD9a5WqfBIYWLh4okyGSI8AY1obeox50",
            authDomain: "mojaaplikacja-6bfaa.firebaseapp.com",
            projectId: "mojaaplikacja-6bfaa",
            storageBucket: "mojaaplikacja-6bfaa.firebasestorage.app",
            messagingSenderId: "586745068789",
            appId: "1:024245da595f9a11b299bc",
            measurementId: "G-M0K7DTZRN1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let unsubscribeSnapshot = null;

        getRedirectResult(auth).catch((error) => {
            console.error("Błąd po przekierowaniu:", error);
        });

        window.zalogujZGoogle = async function() {
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                console.error("Błąd logowania:", error);
                alert("Nie udało się zalogować: " + error.message);
            }
        };

        window.wylogujZGoogle = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Błąd wylogowania:", error);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const userInfo = document.getElementById('userInfo');
            const authBtn = document.getElementById('authBtn');

            if (user) {
                window.currentUser = user;
                userInfo.innerHTML = `👤 ${user.displayName || 'Zalogowano'}`;
                authBtn.textContent = 'Wyloguj';
                authBtn.style.background = '#e74c3c';

                const q = query(collection(db, "pomiary"), where("userId", "==", user.uid));
                
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                
                unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                    let firebaseMeasurements = [];
                    snapshot.forEach((doc) => {
                        firebaseMeasurements.push({ id: doc.id, ...doc.data() });
                    });

                    firebaseMeasurements.sort((a, b) => (b.created || 0) - (a.created || 0));
                    renderMeasurements(firebaseMeasurements);
                });

            } else {
                window.currentUser = null;
                userInfo.innerHTML = '🔒 Niezalogowano';
                authBtn.textContent = 'Zaloguj z Google';
                authBtn.style.background = '#4285F4';

                if (unsubscribeSnapshot) unsubscribeSnapshot();
                renderMeasurements([]);
            }
        });

        window.zapiszPomiarDoFirebase = async function(weight, waist) {
            if (!window.currentUser) return;

            try {
                const dateStr = new Date().toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' });
                await addDoc(collection(db, "pomiary"), {
                    userId: window.currentUser.uid,
                    date: dateStr,
                    weight: weight,
                    waist: waist,
                    created: new Date().getTime()
                });
            } catch (e) {
                console.error("Błąd zapisu:", e);
            }
        };

        window.usunPomiarZFirebase = async function(id) {
            try {
                await deleteDoc(doc(db, "pomiary", id));
            } catch (e) {
                console.error("Błąd usuwania:", e);
            }
        };
    </script>
</body>
</html>
