<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja Redukcja ☁️</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-light: #edf4f8;
            --text: #2c3e50;
            --bg: #f4f7f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* PASEK NAWIGACJI TOP */
        .top-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .nav-link {
            text-decoration: none;
            color: #7a8b99;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        /* KARTY */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text);
        }

        /* KALORIE */
        .progress-bar-bg {
            background: #edf2f7;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .calorie-progress {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            text-align: center;
        }

        .stat-box .num {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-outline {
            background: transparent;
            color: #7a8b99;
            border: 1px solid #e1e8ed;
        }

        .btn-accent {
            background: #4a90e2;
        }
    </style>
</head>
<body>

    <!-- PASEK NAWIGACJI -->
    <nav class="top-nav">
        <a href="index.html" class="nav-link active">🏠 Główna</a>
        <a href="posilki.html" class="nav-link">🍽️ Posiłki</a>
        <a href="trening.html" class="nav-link">⏱️ Trening</a>
    </nav>

    <!-- SZYBKI DZIENNIK KALORII -->
    <div class="card">
        <h2>☁️ Dziennik Kalorii</h2>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="kcalBar"></div></div>
        <div class="calorie-progress">
            <div class="stat-box"><div>Zjedzone</div><div class="num" id="eatenKcal">0</div><div>kcal</div></div>
            <div class="stat-box"><div>Pozostało</div><div class="num" id="leftKcal">1600</div><div>kcal</div></div>
        </div>
        <input type="number" id="addKcalInput" placeholder="Wpisz kalorie posiłku">
        <button class="btn" onclick="addCalories()">Dodaj Posiłek ✨</button>
        <button class="btn btn-outline" onclick="resetCalories()">Resetuj kalorie 🔄</button> 
    </div>

    <!-- POSTĘP WAGI -->
    <div class="card">
        <h2>📈 Postęp Wagi</h2>
        <div style="display: flex; gap: 10px;">
            <input type="number" step="0.1" id="weightInput" placeholder="Dzisiejsza waga (kg)">
            <button class="btn btn-accent" style="width: 40%;" onclick="addWeight()">Zapisz 🩵</button>
        </div>
        <canvas id="weightChart" style="margin-top:15px;"></canvas>
    </div>

    <script>
        // --- 1. KALORIE ---
        const goalKcal = 1600;
        let eaten = parseInt(localStorage.getItem('eatenKcal')) || 0;

        function updateCalorieUI() {
            document.getElementById('eatenKcal').textContent = eaten;
            document.getElementById('leftKcal').textContent = Math.max(0, goalKcal - eaten);
            
            const percentage = Math.min(100, (eaten / goalKcal) * 100);
            document.getElementById('kcalBar').style.width = percentage + '%';
        }

        function addCalories() {
            const input = document.getElementById('addKcalInput');
            const val = parseInt(input.value);
            if (val) {
                eaten += val;
                localStorage.setItem('eatenKcal', eaten);
                updateCalorieUI();
                input.value = '';
            }
        }

        function resetCalories() {
            if (confirm("Na pewno chcesz zresetować dzisiejsze kalorie?")) {
                eaten = 0;
                localStorage.setItem('eatenKcal', eaten);
                localStorage.removeItem('todayMeals');
                updateCalorieUI();
            }
        }

        // --- 2. WAGA I WYKRES ---
        let weightData = JSON.parse(localStorage.getItem('weightData')) || [];
        let weightChart;

        function initChart() {
            const ctx = document.getElementById('weightChart').getContext('2d');
            weightChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: weightData.map(d => d.date),
                    datasets: [{
                        label: 'Waga (kg)',
                        data: weightData.map(d => d.weight),
                        borderColor: '#4a90e2',
                        backgroundColor: 'rgba(74, 144, 226, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: false } }
                }
            });
        }

        function addWeight() {
            const input = document.getElementById('weightInput');
            const weight = parseFloat(input.value);
            if (weight) {
                const today = new Date().toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' });
                weightData.push({ date: today, weight: weight });
                localStorage.setItem('weightData', JSON.stringify(weightData));
                
                weightChart.data.labels = weightData.map(d => d.date);
                weightChart.data.datasets[0].data = weightData.map(d => d.weight);
                weightChart.update();
                
                input.value = '';
            }
        }

        // Inicjalizacja przy starcie
        updateCalorieUI();
        initChart();
    </script>
</body>
</html>
